; 6-DOF Robot Arm Controller
; ESP32 + PCA9685 + 7 Servos + ST7789 Display

[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Зависимости
lib_deps =
    eigen@3.4.0
    adafruit/Adafruit PWM Servo Driver Library@2.4.0
    adafruit/Adafruit GFX Library@1.11.5
    adafruit/Adafruit BusIO@^1.14.1
    bodmer/TFT_eSPI@^2.5.43

; Настройки сборки
build_flags =
    -Iinclude
    -Isrc
    -DESP32
    -DARDUINO=10819
    -DUSE_TFT_DISPLAY
    -DUSE_SERVO_MOTORS
    -std=gnu++17
    -fexceptions
    -fno-rtti
    -O2
    -DCORE_DEBUG_LEVEL=0
    ; ST7789 SPI pins
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCOLOR_DEPTH=16
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4

; Оптимизация
build_unflags =
    -std=gnu++11

; Настройки загрузчика
upload_speed = 921600
upload_port = /dev/ttyACM0
