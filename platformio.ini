; 6-DOF Robot Arm Controller
; ESP32 + PCA9685 + 7 Servos + ST7789 Display

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600

; Зависимости: дисплей — LovyanGFX (DMA, шрифты из коробки).
; Adafruit GFX/ST7789 больше не нужны (код переведён на LovyanGFX API).
; Сервы — janelia-arduino/PCA9685 (микросекунды напрямую, без тиков).
lib_deps =
    janelia-arduino/PCA9685
    adafruit/Adafruit BusIO@^1.14.1
    lovyan03/LovyanGFX
    ; GY-80: БЕЗ сторонних либ — регистры напрямую в imu_logger.cpp
    ; (спарковская и pololu под RTOS чудили). Из реестра больше ничего
    ; не тянем; вернуть 400 кГц (провода 5 см).

; Настройки сборки
build_flags =
    -Iinclude
    -Isrc
    -DESP32
    ;-DARDUINO=10819
    -DUSE_TFT_DISPLAY
    -DUSE_SERVO_MOTORS
    -std=gnu++17
    ;-fno-rtti
    -O2
    -DCORE_DEBUG_LEVEL=0
    ; ST7789 SPI pins (VSPI)
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCOLOR_DEPTH=16
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4

; Оптимизация
build_unflags =
    -std=gnu++11

; Настройки загрузчика
upload_speed = 921600
upload_port = /dev/ttyUSB1
